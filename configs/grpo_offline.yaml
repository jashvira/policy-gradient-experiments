# GRPO Training Configuration
model:
  name: ".models/Qwen2.5-1.5B"
  env_id: "mbpp_baseline"

# Training hyperparameters
training:
  max_steps: 500
  learning_rate: 2.0e-5
  lr_scheduler_type: "constant_with_warmup"
  warmup_steps: 25
  max_grad_norm: 0.5
  num_iterations: 3

# Batch configuration
batch:
  per_device_train_batch_size: 16
  num_generations: 8
  gradient_accumulation_steps: 8

# Sequence and generation lengths
generation:
  max_seq_len: 2048
  max_tokens: 1024
  temperature: 0.7
  top_p: 0.9
  top_k: null

# GRPO-specific parameters
grpo:
  beta: 0.01
  sync_ref_model: true
  ref_model_sync_steps: 100
  ref_model_mixup_alpha: 0.5
  epsilon: 0.2
  loss_type: "dr_grpo"
  delta: null

# Async generation (vLLM)
async_generation:
  num_batches_ahead: 1
  timeout: 300.0
  max_concurrent: 2048

# Evaluation and saving
eval:
  strategy: "steps"
  steps: 10
  per_device_batch_size: 512

save:
  strategy: "steps"
  steps: 100

# Logging
logging:
  steps: 1
  log_completions: true
  report_to: "wandb"
  wandb_project: "mbpp"
  wandb_entity: null
  wandb_name: null

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false