[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vf-mbpp-baseline"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "verifiers[all]",
    "datasets",
    "wandb>=0.21.3",
    "vllm>=0.10.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["environments"]

[tool.uv]
# Optional uv configuration
dev-dependencies = [
    "pytest",
    "black",
    "isort",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
